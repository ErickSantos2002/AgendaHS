<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AgendaHS{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=4">
</head>
<body>
  <main class="container">
    {% with mensagens = get_flashed_messages() %}
      {% if mensagens %}
        <div class="flash">{% for m in mensagens %}<p>{{ m }}</p>{% endfor %}</div>
      {% endif %}
    {% endwith %}
    {% block conteudo %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}?v=2"></script>
</body>
</html>
