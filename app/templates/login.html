{% extends "base.html" %}
{% block title %}Entrar — AgendaHS{% endblock %}
{% block conteudo %}
<section class="card card-estreito">
  <h1>AgendaHS</h1>
  <p class="sub">Painel privado</p>
  {% if erro %}<p class="erro">Senha incorreta</p>{% endif %}
  <form method="post" action="{{ url_for('auth.login') }}">
    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" autofocus required>
    <button type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
